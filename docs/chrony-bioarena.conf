# Chrony drop-in making the field controller the field's time source.
#
# deploy-fms.sh installs this as /etc/chrony/conf.d/bioarena.conf and restarts chrony, so
# there is nothing to do by hand. To place it manually anyway:
#   sudo install -m 644 chrony-bioarena.conf /etc/chrony/conf.d/bioarena.conf
#   sudo systemctl restart chrony
#
# Nothing on a practice field has a battery-backed clock. The Pi restores the last known
# time from fake-hwclock at boot; the switch comes up in 2004. With no route to the
# internet neither can correct itself, so log timestamps across the field disagree by
# years and cannot be correlated after a bad match.
#
# This does not make the time correct -- only consistent. Correct comes from the Pi
# reaching an NTP server at some point, or from setting it by hand.

# Serve time even when this host is not itself synchronised to anything upstream. Without
# this chrony refuses to answer while unsynchronised, which on an isolated field is always.
# Stratum 10 is deliberately poor, so any real upstream source wins if one appears.
local stratum 10

# The field management subnet. The same on every field: the driver station software is
# hardcoded to find its FMS at 10.0.100.5 and bioarena matches it, so a field cannot be
# renumbered. Two fields therefore never share a network, and this file never needs
# widening for another site -- each has its own Pi serving its own island.
allow 10.0.100.0/24

# Team subnets, so driver station laptops can use the field controller as their time
# source as well. Harmless when the teams route through this host anyway.
allow 10.0.0.0/8
